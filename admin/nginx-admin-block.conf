# phase1/admin/nginx-admin-block.conf
# W-04 Fix — Nginx equivalent of the .htaccess admin block
#
# Add this location block inside your server {} block in nginx.conf
# (or your site's conf file in sites-available/)
#
# ─── Nginx ──────────────────────────────────────────────────────────

location ^~ /admin/ {
    # Block all access and return 403 Forbidden.
    # This fires before any other location match due to ^~ prefix.
    return 403;
}

# Also block direct access to auth-config.js as an extra layer:
location = /js/auth-config.js {
    return 403;
}

# Block any .js file under /js/ that contains sensitive config:
# (uncomment if you want blanket JS protection — adjust as needed)
# location ~* ^/js/(auth|config|admin).*\.js$ {
#     return 403;
# }
